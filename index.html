<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    html, body { margin: 0; width: 100%; min-height: 100%; background: #000; }
    body { min-height: 100vh; display: grid; place-items: center; }
    canvas { display: block; width: min(100vw, 142.3406vh); height: auto; }
  </style>
  <script src="index.js" defer></script>

<body>
  <!-- Example: ?melchior=red&balthasar=green&casper=blue&right=審議中 -->

    MAGIの描画にはCanvas APIに対応したブラウザーが必要です。
  </canvas>
</body>
</html>
